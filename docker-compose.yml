services:
  web:
    image: odoo:18.0
    container_name: sattva-odoo-web
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD}
    restart: always
    networks:
      sattva_cloud_net:
        aliases:
          - odoo

  db:
    image: postgres:15-alpine
    container_name: sattva-odoo-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD}
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: always
    networks:
      - sattva_cloud_net

  nextcloud:
    image: nextcloud:apache
    container_name: sattva-nextcloud
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:?set NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - nextcloud-data:/var/www/html
    restart: always
    networks:
      - sattva_cloud_net

  n8n:
    image: n8nio/n8n:latest
    container_name: sattva-n8n
    depends_on:
      - redis
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - EXECUTIONS_MODE=queue
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      - QUEUE_BULL_REDIS_HOST=redis
    volumes:
      - n8n-data:/home/node/.n8n
    restart: always
    networks:
      - sattva_cloud_net

  n8n-worker:
    image: n8nio/n8n:latest
    container_name: sattva-n8n-worker
    command: ["worker"]
    depends_on:
      - redis
      - n8n
    environment:
      - EXECUTIONS_MODE=queue
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      - QUEUE_BULL_REDIS_HOST=redis
    volumes:
      - n8n-data:/home/node/.n8n
    restart: always
    networks:
      - sattva_cloud_net

  redis:
    image: redis:7-alpine
    container_name: sattva-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - sattva_cloud_net

volumes:
  odoo-web-data:
  odoo-db-data:
  nextcloud-data:
  n8n-data:

networks:
  sattva_cloud_net:
    driver: bridge