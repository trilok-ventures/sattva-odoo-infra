# =============================================================================
# Sattva / Trilok Ventures - HARDENED PRODUCTION Odoo 18 config
# =============================================================================
# This file is a TEMPLATE. It is mounted into the `web` container read-only at
# /etc/odoo/odoo.conf.template and rendered to the real /tmp/odoo.conf at
# container start-up (see docker-compose.prod.yml `web.command`).
#
# The two ${...} placeholders below are substituted from the environment
# (loaded from deploy/prod/.env) so that NO secret is baked into this file:
#     ${POSTGRES_PASSWORD}  -> db_password
#     ${ODOO_ADMIN_PASSWD}  -> admin_passwd (master / database-manager password)
#
# NOTE: This is a NEW file. It intentionally does NOT touch the broken committed
# config/odoo.conf. Key fixes vs. that file:
#   * addons_path points at the REAL paths in the official odoo:18.0 image
#     (/mnt/extra-addons + /usr/lib/python3/dist-packages/odoo/addons)
#   * db_host/db_port/db_password are real values (the committed file used
#     `False`, which breaks the Postgres connection)
# =============================================================================

[options]

# ---- Master / database-manager password -------------------------------------
# Rendered from ${ODOO_ADMIN_PASSWD}. Protects /web/database/* manager screens.
admin_passwd = ${ODOO_ADMIN_PASSWD}

# ---- Database connection -----------------------------------------------------
db_host = db
db_port = 5432
db_user = odoo
db_password = ${POSTGRES_PASSWORD}

# Lock this instance to a single database named `sattva` and hide the DB list /
# database manager selector. `list_db = False` also disables /web/database/manager.
db_name = sattva
dbfilter = ^sattva$
list_db = False

# ---- Addons ------------------------------------------------------------------
# Correct paths for the official odoo:18.0 image. /mnt/extra-addons is the
# mounted custom addon (sattva_compliance); the dist-packages path holds the
# stock Odoo modules (base, purchase, contacts, ...).
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Filestore / attachments live here (persisted via the `odoo-data` named volume).
data_dir = /var/lib/odoo

# ---- Reverse proxy -----------------------------------------------------------
# REQUIRED behind Caddy/Cloudflare so Odoo honours X-Forwarded-* headers and
# builds correct absolute (https) URLs. Never expose 8069 directly with this on.
proxy_mode = True

# ---- HTTP / workers ----------------------------------------------------------
# Bind only inside the container network; Caddy is the only thing that reaches it.
http_interface = 0.0.0.0
http_port = 8069

# gevent (a.k.a. longpolling) port. When workers > 0, Odoo serves the /websocket
# and /longpolling endpoints from this SEPARATE gevent process, NOT from 8069.
# Caddy must route /websocket + /longpolling/* to web:8072 (see Caddyfile).
gevent_port = 8072

# Multiprocessing worker count.
#   Formula:  workers = (2 * <CPU cores>) + 1
#   e.g.  1 core -> 3,  2 cores -> 5,  4 cores -> 9
# Also budget RAM: ~150-250 MB per HTTP worker. On a small 1-2 vCPU / 2-4 GB VPS,
# 2-3 workers is realistic. `workers = 0` = threaded/dev mode (then /websocket is
# served on 8069 instead of 8072 - adjust the Caddyfile if you ever set 0).
# Tune this on the host to match the VM you provision.
workers = 2

# Dedicated cron worker(s). Keep small unless you have heavy scheduled jobs.
max_cron_threads = 1

# ---- Request / time / memory limits -----------------------------------------
# Max HTTP request size handled by a worker before it is recycled (in requests).
limit_request = 65536

# Wall-clock seconds a single request may run before the worker is killed.
limit_time_real = 120
# ...and for long cron jobs (looser than interactive requests).
limit_time_real_cron = 300
# CPU seconds per request.
limit_time_cpu = 60

# Per-worker memory watchdog (bytes). Soft = graceful recycle, hard = SIGKILL.
# Defaults tuned for a modest box; raise on larger hosts.
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

# ---- Logging -----------------------------------------------------------------
# Empty logfile => log to stdout/stderr so `docker compose logs` / your log
# driver captures everything (12-factor friendly).
logfile =
log_level = info
log_handler = :INFO

# ---- Misc hardening ----------------------------------------------------------
# Disable the web-based database creation/duplication in the UI (defence in
# depth alongside list_db = False above).
# (Set to True only if you deliberately need the DB manager.)
